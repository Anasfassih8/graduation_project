<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Traffic Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: #e2e8f0;
  height: 100vh;
  overflow: hidden;
}

.container {
  padding: 14px;
  height: 100vh;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.top {
  display: grid;
  grid-template-columns: 1fr 1fr 260px;
  gap: 10px;
}

.bottom {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
  flex: 1;
  min-height: 0;
}

.card {
  background: #1e293b;
  padding: 12px;
  border-radius: 12px;
  box-shadow: 0 0 10px rgba(0,0,0,0.3);
}

.card h3 {
  font-size: 0.85em;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: #94a3b8;
  margin-bottom: 10px;
}

/* SUMMARY GRID */
.summary-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}

.metric-card {
  background: #0f172a;
  border-radius: 8px;
  padding: 10px;
}

.metric-label {
  font-size: 0.7em;
  color: #64748b;
  margin-bottom: 4px;
}

.metric-value {
  font-size: 1.25em;
  font-weight: bold;
  color: #f1f5f9;
}

/* SEGMENTS */
.segments-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  max-height: 220px;
  overflow-y: auto;
  padding-right: 2px;
}

.segments-grid::-webkit-scrollbar { width: 4px; }
.segments-grid::-webkit-scrollbar-track { background: transparent; }
.segments-grid::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

.segment {
  background: #0f172a;
  border-radius: 8px;
  padding: 8px;
  border-left: 4px solid #334155;
  font-size: 0.78em;
}

.segment p { color: #94a3b8; margin: 2px 0; }
.segment p span { color: #e2e8f0; font-weight: bold; }
.segment h4 { font-size: 0.85em; margin-bottom: 4px; color: #cbd5e1; }

.segment.low  { border-left-color: #22c55e; }
.segment.medium { border-left-color: #facc15; }
.segment.high { border-left-color: #ef4444; }

/* TRAFFIC LIGHT */
.light-panel {
  display: flex;
  align-items: center;
  gap: 16px;
}

.traffic-light {
  width: 44px;
  padding: 8px;
  background: #0a0a0a;
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  border: 1px solid #1e293b;
}

.light {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  opacity: 0.15;
  transition: opacity 0.3s, box-shadow 0.3s;
}

.red    { background: #ef4444; }
.yellow { background: #facc15; }
.green  { background: #22c55e; }

.light.active {
  opacity: 1;
  box-shadow: 0 0 12px currentColor;
}

.light-info { display: flex; flex-direction: column; gap: 6px; }

.light-state {
  font-size: 1.1em;
  font-weight: bold;
}

.light-state.RED    { color: #ef4444; }
.light-state.YELLOW { color: #facc15; }
.light-state.GREEN  { color: #22c55e; }

.light-detail {
  font-size: 0.78em;
  color: #64748b;
}

.light-detail span { color: #94a3b8; }

/* CHART CONTAINER */
.chart-wrap {
  position: relative;
  flex: 1;
  min-height: 0;
}

canvas {
  width: 100% !important;
  height: 160px !important;
}

/* STATUS DOT */
.status-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 8px;
}

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #22c55e;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
</style>
</head>
<body>
<div class="container">

  <!-- TOP SECTION -->
  <div class="top">

    <!-- SUMMARY -->
    <div class="card">
      <div class="status-row">
        <div class="status-dot"></div>
        <h3 style="margin:0">Overview</h3>
      </div>
      <div id="summaryCards" class="summary-grid"></div>
    </div>

    <!-- SEGMENTS -->
    <div class="card">
      <h3>Road Segments</h3>
      <div id="segments" class="segments-grid"></div>
    </div>

    <!-- TRAFFIC LIGHT -->
    <div class="card">
      <h3>Traffic Signal</h3>
      <div class="light-panel">
        <div class="traffic-light">
          <div id="redLight"    class="light red"></div>
          <div id="yellowLight" class="light yellow"></div>
          <div id="greenLight"  class="light green"></div>
        </div>
        <div class="light-info">
          <div id="lightState" class="light-state">--</div>
          <div class="light-detail">Timer: <span id="lightTimer">--</span></div>
          <div class="light-detail">Next: <span id="lightNext">--</span></div>
          <div class="light-detail">Rec. Speed: <span id="lightSpeed">--</span></div>
        </div>
      </div>
    </div>

  </div>

  <!-- BOTTOM SECTION (CHARTS) -->
  <div class="bottom">

    <div class="card">
      <h3>Congestion per segment</h3>
      <canvas id="barChart"></canvas>
    </div>

    <div class="card">
      <h3>Speed trend</h3>
      <canvas id="speedChart"></canvas>
    </div>

    <div class="card">
      <h3>Congestion trend</h3>
      <canvas id="congestionChart"></canvas>
    </div>

  </div>
</div>

<script>
const API = "http://localhost:5052/api/traffic";

// ─── UTILITIES ──────────────────────────────────────────────
function getCongestionLevel(index) {
  if (index < 0.4) return 'low';
  if (index < 0.7) return 'medium';
  return 'high';
}

// ─── FETCH FUNCTIONS ────────────────────────────────────────

// Segments — for the segment cards and charts
async function fetchSegments() {
  const res = await fetch(`${API}/segments`);
  const raw = await res.json();
  if (!Array.isArray(raw) || raw.length === 0) return [];

  // Keep only latest row per segment (server uses DISTINCT ON but just in case)
  const map = new Map();
  raw.forEach(s => map.set(s.segmentId, s));
  return Array.from(map.values());
}

// Summary — use the backend-calculated values, not client-side recalculation
async function fetchSummary() {
  const res = await fetch(`${API}/summary`);
  return await res.json();
}

// Traffic light
async function fetchLight() {
  const res = await fetch(`${API}/light`);
  return await res.json();
}

// ─── RENDER SUMMARY ─────────────────────────────────────────
// Uses the /summary endpoint directly — backend does the math
function renderSummary(summary) {
  if (!summary) return;

  const cards = [
    { label: 'Total Vehicles',     value: summary.totalVehicles ?? '--' },
    { label: 'Average Speed',      value: (summary.avgSpeed ?? '--') + ' km/h' },
    { label: 'Avg Congestion',     value: summary.avgCongestion != null
                                      ? (summary.avgCongestion * 100).toFixed(0) + '%'
                                      : '--' },
    { label: 'Recommended Speed',  value: (summary.recommendedSpeed ?? '--') + ' km/h' },
    { label: 'Worst Segment',      value: summary.worstSegment != null
                                      ? 'Segment ' + summary.worstSegment
                                      : '--' },
  ];

  document.getElementById('summaryCards').innerHTML = cards.map(c => `
    <div class="metric-card">
      <div class="metric-label">${c.label}</div>
      <div class="metric-value">${c.value}</div>
    </div>
  `).join('');
}

// ─── RENDER SEGMENTS ────────────────────────────────────────
function renderSegments(data) {
  if (!data || data.length === 0) {
    document.getElementById('segments').innerHTML =
      '<p style="color:#64748b;font-size:0.8em">No segment data yet</p>';
    return;
  }

  document.getElementById('segments').innerHTML = data.map(s => {
    const level = getCongestionLevel(s.congestionIndex);
    return `
      <div class="segment ${level}">
        <h4>Segment ${s.segmentId}</h4>
        <p>Vehicles: <span>${s.vehicleCount}</span></p>
        <p>Speed: <span>${s.avgSpeed} km/h</span></p>
        <p>Congestion: <span>${(s.congestionIndex * 100).toFixed(0)}%</span></p>
        <p>Rec. Speed: <span>${s.recommendedSpeed} km/h</span></p>
      </div>
    `;
  }).join('');
}

// ─── TRAFFIC LIGHT ──────────────────────────────────────────
let countdownInterval = null;
let lastLightState = null;  // only reset timer when STATE changes, not timestamp

function renderTrafficLight(light) {
  if (!light) return;

  // Update light visuals
  ['red','yellow','green'].forEach(c =>
    document.getElementById(c + 'Light').classList.remove('active')
  );

  if (light.state === 'RED')    document.getElementById('redLight').classList.add('active');
  if (light.state === 'YELLOW') document.getElementById('yellowLight').classList.add('active');
  if (light.state === 'GREEN')  document.getElementById('greenLight').classList.add('active');

  const stateEl = document.getElementById('lightState');
  stateEl.textContent = light.state;
  stateEl.className = 'light-state ' + light.state;

  document.getElementById('lightNext').textContent  = light.nextState ?? '--';
  document.getElementById('lightSpeed').textContent = (light.recommendedSpeed ?? '--') + ' km/h';

  // Calculate remaining time from timestamp + duration
  const start     = new Date(light.timeStamp + 'Z');
  const elapsed   = Math.floor((Date.now() - start.getTime()) / 1000);
  const remaining = Math.max(0, light.duration - elapsed);

  // Only restart countdown when the state actually changes
  if (lastLightState !== light.state) {
    lastLightState = light.state;

    if (countdownInterval) clearInterval(countdownInterval);

    let timer = remaining;
    document.getElementById('lightTimer').textContent = timer + ' s';

    countdownInterval = setInterval(() => {
      timer = Math.max(0, timer - 1);
      document.getElementById('lightTimer').textContent = timer + ' s';
    }, 1000);
  }
}

// ─── CHARTS ─────────────────────────────────────────────────
const chartDefaults = {
  responsive: true,
  maintainAspectRatio: false,
  plugins: {
    legend: { labels: { color: '#94a3b8', font: { size: 11 } } }
  },
  scales: {
    x: {
      ticks: { color: '#64748b', font: { size: 10 } },
      grid:  { color: 'rgba(255,255,255,0.05)' }
    },
    y: {
      ticks: { color: '#64748b', font: { size: 10 } },
      grid:  { color: 'rgba(255,255,255,0.05)' }
    }
  }
};

let barChart, speedChart, congestionChart;

function initCharts() {
  barChart = new Chart(document.getElementById('barChart'), {
    type: 'bar',
    data: {
      labels: [],
      datasets: [{
        label: 'Congestion index',
        data: [],
        backgroundColor: ctx => {
          const v = ctx.raw;
          if (v >= 0.7) return 'rgba(239,68,68,0.7)';
          if (v >= 0.4) return 'rgba(250,204,21,0.7)';
          return 'rgba(34,197,94,0.7)';
        },
        borderRadius: 4,
      }]
    },
    options: {
      ...chartDefaults,
      scales: {
        ...chartDefaults.scales,
        y: { ...chartDefaults.scales.y, min: 0, max: 1 }
      }
    }
  });

  speedChart = new Chart(document.getElementById('speedChart'), {
    type: 'line',
    data: {
      labels: [],
      datasets: [{
        label: 'Avg speed (km/h)',
        data: [],
        borderColor: '#38bdf8',
        backgroundColor: 'rgba(56,189,248,0.1)',
        tension: 0.3,
        fill: true,
        pointRadius: 3,
      }]
    },
    options: chartDefaults
  });

  congestionChart = new Chart(document.getElementById('congestionChart'), {
    type: 'line',
    data: {
      labels: [],
      datasets: [{
        label: 'Avg congestion',
        data: [],
        borderColor: '#f97316',
        backgroundColor: 'rgba(249,115,22,0.1)',
        tension: 0.3,
        fill: true,
        pointRadius: 3,
      }]
    },
    options: {
      ...chartDefaults,
      scales: {
        ...chartDefaults.scales,
        y: { ...chartDefaults.scales.y, min: 0, max: 1 }
      }
    }
  });
}

const history = { time: [], speed: [], congestion: [] };

function updateCharts(segments, summary) {
  if (!segments || segments.length === 0) return;

  // Bar chart uses per-segment data
  barChart.data.labels   = segments.map(s => 'Seg ' + s.segmentId);
  barChart.data.datasets[0].data = segments.map(s => s.congestionIndex);
  barChart.update();

  // Trend charts use summary values (already computed server-side)
  const timeLabel = new Date().toLocaleTimeString();
  history.time.push(timeLabel);
  history.speed.push(summary?.avgSpeed ?? 0);
  history.congestion.push(summary?.avgCongestion ?? 0);

  // Keep last 12 data points
  if (history.time.length > 12) {
    history.time.shift();
    history.speed.shift();
    history.congestion.shift();
  }

  speedChart.data.labels = history.time;
  speedChart.data.datasets[0].data = history.speed;
  speedChart.update();

  congestionChart.data.labels = history.time;
  congestionChart.data.datasets[0].data = history.congestion;
  congestionChart.update();
}

// ─── MAIN LOOP ───────────────────────────────────────────────
async function updateDashboard() {
  try {
    const [segments, summary, light] = await Promise.all([
      fetchSegments(),
      fetchSummary(),
      fetchLight()
    ]);

    renderSummary(summary);
    renderSegments(segments);
    updateCharts(segments, summary);
    renderTrafficLight(light);
  } catch (err) {
    console.error('Dashboard error:', err);
  }
}

function init() {
  initCharts();
  updateDashboard();
  setInterval(updateDashboard, 5000);
}

init();
</script>
</body>
</html>
